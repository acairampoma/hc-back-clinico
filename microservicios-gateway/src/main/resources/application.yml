spring:
  application:
    name: microservicio-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false

      # CONFIGURACIÓN CORS SIMPLE
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedOrigins: "http://localhost:8000"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true

      # CONFIGURACIÓN DE RUTAS - CORREGIDO
      routes:
        # OAuth2 Authorization Server
        - id: microservicio-oauth2
          uri: lb://microservicio-oauth2
          predicates:
            - Path=/oauth2/**
          filters:
            - RewritePath=/oauth2/(?<path>.*), /auth/oauth2/$\{path}

        # Well-known endpoints
        - id: microservicio-oauth2-wellknown
          uri: lb://microservicio-oauth2
          predicates:
            - Path=/.well-known/**
          filters:
            - PrefixPath=/auth

        # Swagger docs para OAuth2
        - id: microservicio-oauth2-swagger
          uri: lb://microservicio-oauth2
          predicates:
            - Path=/oauth2/v3/api-docs
          filters:
            - RewritePath=/oauth2/v3/api-docs, /auth/v3/api-docs

        # Usuarios - clientes OAuth específicos
        - id: microservicio-usuarios-clients
          uri: lb://microservicio-usuarios
          predicates:
            - Path=/api/usuarios/clients/**
          filters:
            - StripPrefix=2

        # Usuarios - ruta general
        - id: microservicio-usuarios
          uri: lb://microservicio-usuarios
          predicates:
            - Path=/api/usuarios/**
          filters:
            - StripPrefix=2

        # Test microservice
        - id: microservicio-test
          uri: lb://microservicio-test
          predicates:
            - Path=/api/test/**
          filters:
            - StripPrefix=2

        # Listas microservice
        - id: microservicio-listas
          uri: lb://microservicio-listas
          predicates:
            - Path=/api/listas/**
          filters:
            - StripPrefix=2

        # Swagger docs para Listas - Configuración corregida
        - id: microservicio-listas-swagger
          uri: lb://microservicio-listas
          predicates:
            - Path=/api/listas/v3/api-docs
          filters:
            - StripPrefix=2

        # Pacientes (usando microservicio-listas)
        - id: microservicio-pacientes
          uri: lb://microservicio-listas
          predicates:
            - Path=/api/pacientes/**
          filters:
            - StripPrefix=1

        # Swagger docs para Pacientes - Configuración corregida
        - id: microservicio-pacientes-swagger
          uri: lb://microservicio-listas
          predicates:
            - Path=/api/pacientes/v3/api-docs
          filters:
            - StripPrefix=1

        # Notas microservice
        - id: microservicio-notas
          uri: lb://microservicio-notas
          predicates:
            - Path=/api/notas/**
          filters:
            - StripPrefix=2

        # Swagger docs para Notas - Configuración exactamente igual a Listas/Usuarios
        - id: microservicio-notas-swagger
          uri: lb://microservicio-notas
          predicates:
            - Path=/api/notas/v3/api-docs
          filters:
            - StripPrefix=2

        # Recetas microservice
        - id: microservicio-receta
          uri: lb://microservicio-receta
          predicates:
            - Path=/api/recetas/**
          filters:
            - StripPrefix=2

        # Swagger docs para Recetas - Configuración exactamente igual a Listas/Usuarios
        - id: microservicio-receta-swagger
          uri: lb://microservicio-receta
          predicates:
            - Path=/api/recetas/v3/api-docs
          filters:
            - StripPrefix=2

        # Órdenes microservice
        - id: microservicio-orden
          uri: lb://microservicio-orden
          predicates:
            - Path=/api/ordenes/**
          filters:
            - StripPrefix=1

        # Catálogos microservice
        - id: microservicio-catalogos
          uri: lb://microservicio-catalogos
          predicates:
            - Path=/api/catalogos/**
          filters:
            - StripPrefix=1

  # CONFIGURACIÓN JWT SECURITY
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8082/auth/.well-known/jwks.json

server:
  port: ${PORT:8090}

eureka:
  client:
    service-url:
      default-zone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.value}

# CONFIGURACIÓN JWT PERSONALIZADA
oauth2:
  jwk-set-uri: http://localhost:8082/auth/.well-known/jwks.json

management:
  endpoints:
    web:
      exposure:
        include: "*"

# CONFIGURACIÓN SPRINGDOC OPENAPI/SWAGGER
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    config-url: /v3/api-docs/swagger-config
    urls:
      - url: /v3/api-docs
        name: API Gateway
      - url: /api/usuarios/v3/api-docs
        name: Usuarios
      - url: /api/listas/v3/api-docs
        name: Listas
      - url: /api/notas/v3/api-docs
        name: Notas
      - url: /api/recetas/v3/api-docs
        name: Recetas
  api-docs:
    enabled: true
    path: /v3/api-docs
  cache:
    disabled: true
  webjars:
    prefix: /webjars

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web.reactive: DEBUG
    org.springframework.security: DEBUG