spring:
  application:
    name: microservicio-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false

      # 🌐 CONFIGURACIÓN CORS SIMPLE
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "http://localhost:8000"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true

      # 🛣️ CONFIGURACIÓN DE RUTAS - ORDEN IMPORTANTE (más específicas primero)
      routes:
        # OAuth2 Authorization Server
        - id: microservicio-oauth2
          uri: lb://microservicio-oauth2
          predicates:
            - Path=/oauth2/**
          filters:
            - RewritePath=/oauth2/(?<path>.*), /auth/oauth2/$\{path}

        # Well-known endpoints
        - id: microservicio-oauth2-wellknown
          uri: lb://microservicio-oauth2
          predicates:
            - Path=/.well-known/**
          filters:
            - PrefixPath=/auth

        # Usuarios con rutas específicas primero
        - id: microservicio-usuarios-clients
          uri: lb://microservicio-usuarios
          predicates:
            - Path=/api/usuarios/clients/**
          filters:
            - StripPrefix=2  # Quita /api/usuarios, deja /clients/**

        # Usuarios - ruta general
        - id: microservicio-usuarios
          uri: lb://microservicio-usuarios
          predicates:
            - Path=/api/usuarios/**
          filters:
            - StripPrefix=2  # Quita /api/usuarios, envía /**

        # Test
        - id: microservicio-test
          uri: lb://microservicio-test
          predicates:
            - Path=/api/test/**
          filters:
            - StripPrefix=2  # Quita /api/test, envía /**

        # Listas
        - id: microservicio-listas
          uri: lb://microservicio-listas
          predicates:
            - Path=/api/listas/**
          filters:
            - StripPrefix=2  # Quita /api/listas, envía /**

        # ✅ PACIENTES - CORREGIDO
        - id: microservicio-pacientes
          uri: lb://microservicio-listas
          predicates:
            - Path=/api/pacientes/**
          filters:
            - StripPrefix=1  # Quita /api, envía /pacientes/** al microservicio

        # Notas
        - id: microservicio-notas
          uri: lb://microservicio-notas
          predicates:
            - Path=/api/notas/**
          filters:
            - StripPrefix=1  # Quita /api, envía /notas/**

        # Recetas
        - id: microservicio-receta
          uri: lb://microservicio-receta
          predicates:
            - Path=/api/recetas/**
          filters:
            - StripPrefix=1  # Quita /api, envía /recetas/**

        # Órdenes
        - id: microservicio-orden
          uri: lb://microservicio-orden
          predicates:
            - Path=/api/ordenes/**
          filters:
            - StripPrefix=1  # Quita /api, envía /ordenes/**

        # Catálogos
        - id: microservicio-catalogos
          uri: lb://microservicio-catalogos
          predicates:
            - Path=/api/catalogos/**
          filters:
            - StripPrefix=1  # Quita /api, envía /catalogos/**

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8082/auth/.well-known/jwks.json

server:
  port: ${PORT:8090}

eureka:
  client:
    service-url:
      default-zone: https://spring-cloud-netflix-eureka-production-5bb2.up.railway.app/eureka
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.value}

management:
  endpoints:
    web:
      exposure:
        include: "*"

oauth2:
  jwk-set-uri: http://localhost:8082/auth/.well-known/jwks.json

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web.reactive: DEBUG
    org.springframework.security: DEBUG