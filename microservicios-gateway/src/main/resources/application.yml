spring:
  application:
    name: microservicio-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        # CORREGIDO: Ruta para OAuth2 Authorization Server con context-path
        - id: microservicio-oauth2
          uri: lb://microservicio-oauth2
          predicates:
            - Path=/oauth2/**
          filters:
            - RewritePath=/oauth2/(?<path>.*), /auth/oauth2/$\{path}

        # NUEVA: Ruta para well-known endpoints (JWK, OpenID Config)
        - id: microservicio-oauth2-wellknown
          uri: lb://microservicio-oauth2
          predicates:
            - Path=/.well-known/**
          filters:
            - PrefixPath=/auth

        # Ruta para usuarios (endpoints generales) - PROTEGIDA
        - id: microservicio-usuarios
          uri: lb://microservicio-usuarios
          predicates:
            - Path=/api/usuarios/**
          filters:
            - StripPrefix=2

        # Ruta específica para clientes OAuth - PROTEGIDA
        - id: microservicio-usuarios-clients
          uri: lb://microservicio-usuarios
          predicates:
            - Path=/api/usuarios/clients/**
          filters:
            - StripPrefix=2
            - PrefixPath=/api

        # Ruta para microservicio test - PROTEGIDA
        - id: microservicio-test
          uri: lb://microservicio-test
          predicates:
            - Path=/api/test/**
          filters:
            - StripPrefix=2

  # ✨ CONFIGURACIÓN JWT SECURITY
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8082/auth/.well-known/jwks.json

server:
  port: 8090

eureka:
  client:
    service-url:
      default-zone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.value}

# ✨ CONFIGURACIÓN JWT PERSONALIZADA
oauth2:
  jwk-set-uri: http://localhost:8082/auth/.well-known/jwks.json

management:
  endpoints:
    web:
      exposure:
        include: "*"
  # ❌ REMOVIDO: Conflicto con JWT security
  # security:
  #   enabled: false

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web.reactive: DEBUG
    org.springframework.security: DEBUG  # ✨ AGREGADO para debugging JWT