# 🔧 GATEWAY APPLICATION-RAILWAY.YML - CONFIGURACIÓN CORREGIDA
# Ubicación: /microservicio-gateway/src/main/resources/application-railway.yml

# ============================================
# 🚀 SPRING CONFIGURATION
# ============================================
spring:
  application:
    name: microservicio-gateway
  cloud:
    gateway:
      # ✅ DESCUBRIMIENTO AUTOMÁTICO - DESHABILITADO
      discovery:
        locator:
          enabled: false  # ❌ DESHABILITAR para evitar conflicto de rutas
          lower-case-service-id: true

      # ✅ CONFIGURACIÓN DE TIMEOUTS
      httpclient:
        connect-timeout: 10000
        response-timeout: 30s
        pool:
          max-idle-time: 30s

      # ✅ RUTAS CORREGIDAS
      routes:
        # OAuth2 - RUTA CORREGIDA
        - id: microservicio-oauth2
          uri: lb://microservicio-oauth2
          predicates:
            - Path=/oauth2/**
          filters:
            # ✅ CORREGIDO: /oauth2/password-token -> /auth/password-token
            - RewritePath=/oauth2/(?<path>.*), /auth/$\{path}
            - PreserveHostHeader

        # Usuarios - RUTA CORREGIDA
        - id: microservicio-usuarios
          uri: lb://microservicio-usuarios
          predicates:
            - Path=/api/usuarios/**
          filters:
            # ✅ CORREGIDO: Solo remueve /api
            - StripPrefix=1
            - PreserveHostHeader

# ============================================
# 🔍 EUREKA CLIENT CONFIGURATION - CORREGIDA
# ============================================
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:https://hc-back-clinico-production.up.railway.app/eureka}
    register-with-eureka: true
    fetch-registry: true
    registry-fetch-interval-seconds: 30

  instance:
    prefer-ip-address: false
    # ✅ CORREGIDO: Usar Railway Public Domain
    hostname: ${RAILWAY_PUBLIC_DOMAIN:respectful-purpose-production.up.railway.app}
    # ✅ CORREGIDO: Usar PORT sin fallback
    non-secure-port: ${PORT}
    instance-id: ${spring.application.name}:${RAILWAY_REPLICA_ID:${random.value}}
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90
    metadata-map:
      management.port: ${PORT}
      railway.deployment: production
      gateway.version: "1.0.0"

# ============================================
# 🌐 SERVER CONFIGURATION - CORREGIDA
# ============================================
server:
  # ✅ CORREGIDO: Usar PORT sin fallback
  port: ${PORT}

# ============================================
# 📊 ACTUATOR & MONITORING
# ============================================
management:
  endpoints:
    web:
      exposure:
        include: "health,info,env,metrics,gateway"
      base-path: /actuator
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true
  info:
    env:
      enabled: true

# ============================================
# 📝 LOGGING CONFIGURATION
# ============================================
logging:
  level:
    root: INFO
    # Gateway específico
    org.springframework.cloud.gateway: DEBUG
    org.springframework.cloud.loadbalancer: DEBUG
    # Eureka
    org.springframework.cloud.netflix.eureka: DEBUG
    com.netflix.eureka: INFO
    com.netflix.discovery: INFO
    # Tu paquete específico
    com.formacionbdi: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%logger{36}] - %msg%n"

# ============================================
# 🎯 RAILWAY ENVIRONMENT INFO
# ============================================
info:
  app:
    name: ${spring.application.name}
    description: "API Gateway - Sistema Hospitalario"
    version: "1.0.0"
    environment: "railway-production"
  java:
    version: ${java.version}
  railway:
    service: "gateway"
    deployment-url: ${RAILWAY_PUBLIC_DOMAIN:not-set}
    eureka-server: "hc-back-clinico-production.up.railway.app"
    oauth2-service: "brilliant-bravery-production.up.railway.app"
    usuarios-service: "vivacious-benevolence-production.up.railway.app"

