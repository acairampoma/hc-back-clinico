spring:
  application:
    name: microservicio-gateway
  cloud:
    gateway:
      routes:
        - id: microservicio-oauth2
          uri: lb://microservicio-oauth2
          predicates:
            - Path=/oauth2/**
          filters:
            - RewritePath=/oauth2/(?<path>.*), /auth/oauth2/$\{path}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:https://hc-back-clinico-production.up.railway.app/eureka}
    register-with-eureka: true
    fetch-registry: true
    healthcheck:
      enabled: false  # ← CRITICAL para Railway
    eureka-connection-idle-timeout-seconds: 30  # ← AWS/Railway recomendado
    eureka-server-read-timeout-seconds: 8
    eureka-server-connect-timeout-seconds: 5
  instance:
    lease-renewal-interval-in-seconds: 10  # Más frecuente
    lease-expiration-duration-in-seconds: 30

# RIBBON TIMEOUTS para Railway
ribbon:
  ConnectTimeout: 3000
  ReadTimeout: 10000
  MaxAutoRetries: 1
  MaxAutoRetriesNextServer: 1