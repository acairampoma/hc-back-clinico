spring:
  application:
    name: microservicio-gateway
  cloud:
    gateway:
      routes:
        - id: microservicio-oauth2
          uri: lb://microservicio-oauth2
          predicates:
            - Path=/oauth2/**
          filters:
            - RewritePath=/oauth2/(?<path>.*), /auth/oauth2/$\{path}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:https://hc-back-clinico-production.up.railway.app/eureka}
    register-with-eureka: true
    fetch-registry: true
    # QUITAR TODAS LAS CONFIGURACIONES COMPLEJAS
  instance:
    prefer-ip-address: false

server:
  port: 8090

management:
  endpoints:
    web:
      exposure:
        include: "*"

# QUITAR RIBBON - usar Spring Cloud LoadBalancer por defecto