spring:
  application:
    name: microservicio-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false  # ✅ CORRECTO - usas rutas específicas

      # 🌐 CORS - AJUSTADO PARA RAILWAY
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:8000"
              - "https://*.up.railway.app"  # Railway domains
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true

      # 🛣️ RUTAS - VERIFICADAS PARA RAILWAY
      routes:
        # OAuth2 Authorization Server
        - id: microservicio-oauth2
          uri: lb://microservicio-oauth2
          predicates:
            - Path=/oauth2/**
          filters:
            - RewritePath=/oauth2/(?<path>.*), /auth/oauth2/$\{path}

        # Well-known endpoints
        - id: microservicio-oauth2-wellknown
          uri: lb://microservicio-oauth2
          predicates:
            - Path=/.well-known/**
          filters:
            - PrefixPath=/auth

        # Usuarios con rutas específicas primero
        - id: microservicio-usuarios-clients
          uri: lb://microservicio-usuarios
          predicates:
            - Path=/api/usuarios/clients/**
          filters:
            - StripPrefix=2

        # Usuarios - ruta general
        - id: microservicio-usuarios
          uri: lb://microservicio-usuarios
          predicates:
            - Path=/api/usuarios/**
          filters:
            - StripPrefix=2

        # Test
        - id: microservicio-test
          uri: lb://microservicio-test
          predicates:
            - Path=/api/test/**
          filters:
            - StripPrefix=2

        # Listas
        - id: microservicio-listas
          uri: lb://microservicio-listas
          predicates:
            - Path=/api/listas/**
          filters:
            - StripPrefix=2

        # Pacientes
        - id: microservicio-pacientes
          uri: lb://microservicio-listas
          predicates:
            - Path=/api/pacientes/**
          filters:
            - StripPrefix=1

        # Notas
        - id: microservicio-notas
          uri: lb://microservicio-notas
          predicates:
            - Path=/api/notas/**
          filters:
            - StripPrefix=1

        # Recetas
        - id: microservicio-receta
          uri: lb://microservicio-receta
          predicates:
            - Path=/api/recetas/**
          filters:
            - StripPrefix=1

        # Órdenes
        - id: microservicio-orden
          uri: lb://microservicio-orden
          predicates:
            - Path=/api/ordenes/**
          filters:
            - StripPrefix=1

        # Catálogos
        - id: microservicio-catalogos
          uri: lb://microservicio-catalogos
          predicates:
            - Path=/api/catalogos/**
          filters:
            - StripPrefix=1

server:
  port: ${PORT:8090}  # ✅ Railway port

# 🔍 EUREKA - AJUSTADO PARA NUESTRO EUREKA EN RAILWAY
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:https://hc-back-clinico-production.up.railway.app/eureka}
    register-with-eureka: true
    fetch-registry: true
    registry-fetch-interval-seconds: 30
  instance:
    hostname: ${RAILWAY_PUBLIC_DOMAIN:gateway.railway.internal}
    prefer-ip-address: false  # Railway prefiere hostnames
    instance-id: ${spring.application.name}:${RAILWAY_REPLICA_ID:${random.value}}
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90

# 📊 MANAGEMENT & ACTUATOR
management:
  endpoint:
    gateway:
      enabled: true
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: "*"

# 📝 LOGGING
logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web.reactive: DEBUG
    org.springframework.security: DEBUG
    com.netflix.eureka: INFO
    com.netflix.discovery: INFO

# ============================================
# 🎯 RAILWAY INFO
# ============================================
info:
  app:
    name: ${spring.application.name}
    description: "API Gateway - Sistema Hospitalario"
    version: "1.0.0"
    environment: "railway-production"
  railway:
    eureka-server: "hc-back-clinico-production.up.railway.app"
    services-configured: "oauth2,usuarios,test,listas,notas,receta,orden,catalogos"