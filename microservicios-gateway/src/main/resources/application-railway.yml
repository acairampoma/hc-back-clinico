# 🔧 GATEWAY APPLICATION-RAILWAY.YML - CONFIGURACIÓN FUNCIONAL
# Ubicación: /microservicio-gateway/src/main/resources/application-railway.yml

spring:
  application:
    name: microservicio-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false

      # 🌐 CONFIGURACIÓN CORS
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"  # ✅ Para Railway permite todos
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: false  # ✅ false para Railway

      # 🛣️ CONFIGURACIÓN DE RUTAS (IGUAL QUE LOCAL)
      routes:
        # OAuth2 - IGUAL QUE TU LOCAL
        - id: microservicio-oauth2
          uri: lb://microservicio-oauth2
          predicates:
            - Path=/oauth2/**
          filters:
            - RewritePath=/oauth2/(?<path>.*), /auth/oauth2/$\{path}

        # Well-known endpoints
        - id: microservicio-oauth2-wellknown
          uri: lb://microservicio-oauth2
          predicates:
            - Path=/.well-known/**
          filters:
            - PrefixPath=/auth

        # Usuarios con rutas específicas primero
        - id: microservicio-usuarios-clients
          uri: lb://microservicio-usuarios
          predicates:
            - Path=/api/usuarios/clients/**
          filters:
            - StripPrefix=2  # Quita /api/usuarios, deja /clients/**

        # Usuarios - ruta general
        - id: microservicio-usuarios
          uri: lb://microservicio-usuarios
          predicates:
            - Path=/api/usuarios/**
          filters:
            - StripPrefix=2  # Quita /api/usuarios, envía /**

  # 🔐 SECURITY - CORREGIDO PARA RAILWAY
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: https://brilliant-bravery-production.up.railway.app:8082/auth/.well-known/jwks.json

server:
  port: ${PORT}  # ✅ Railway asigna automáticamente

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:https://hc-back-clinico-production.up.railway.app/eureka}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: false  # ✅ Cambio para Railway
    hostname: ${RAILWAY_PUBLIC_DOMAIN:respectful-purpose-production.up.railway.app}
    non-secure-port: ${PORT}
    instance-id: ${spring.application.name}:${RAILWAY_REPLICA_ID:${random.value}}

management:
  endpoints:
    web:
      exposure:
        include: "*"

# 🔧 OAUTH2 JWK - CORREGIDO PARA RAILWAY
oauth2:
  jwk-set-uri: https://brilliant-bravery-production.up.railway.app:8082/auth/.well-known/jwks.json

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web.reactive: DEBUG
    org.springframework.security: DEBUG