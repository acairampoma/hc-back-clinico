# 🏥 CONFIGURACIÓN SIMULADOR HL7 PHILIPS MX450
# Versión: 2.1.1 - Conexión a bd_hdigital

# ==========================================
# SERVIDOR HL7 (DESTINO) - CORREGIDO TIMEOUT
# ==========================================
hl7:
  server:
    host: localhost              # IP del servidor HL7
    port: 2575                   # Puerto TCP MLLP
    timeout: 5000                # ✅ 5 segundos timeout (reducido)
    max-retries: 2               # ✅ 2 reintentos (reducido)
    retry-delay: 1000            # ✅ 1 segundo entre reintentos

# ==========================================
# BASE DE DATOS bd_hdigital
# ==========================================
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/bd_hdigital
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver

  # ✅ CONFIGURACIÓN CRÍTICA PARA SWING
  main:
    web-application-type: none    # No iniciar servidor web
    allow-bean-definition-overriding: true

  # JPA / Hibernate (opcional para consultas)
  jpa:
    hibernate:
      ddl-auto: none             # No modificar esquema
    show-sql: false              # No mostrar SQL en consola
    database-platform: org.hibernate.dialect.PostgreSQLDialect

# ==========================================
# CONFIGURACIÓN DEL EQUIPO SIMULADO
# ==========================================
simulator:
  equipment:
    code: "MON_101E_001"         # Código único del monitor
    name: "Philips MX450"        # Nombre del equipo
    manufacturer: "PHILIPS"      # Fabricante
    model: "IntelliVue MX450"    # Modelo específico
    location: "UCI"              # Ubicación del equipo
    bed: "3E-301A"               # Cama por defecto

  # Configuración de mensajes HL7
  hl7:
    version: "2.5"               # Versión HL7
    sending-application: "PHILIPS_MX450"    # MSH.3
    sending-facility: "UCI"                 # MSH.4
    receiving-application: "HIS_SYSTEM"     # MSH.5
    receiving-facility: "HOSPITAL"          # MSH.6

  # Configuración de signos vitales
  vital-signs:
    interval-seconds: 30         # Envío cada 30 segundos
    heart-rate:
      min: 60                    # FC mínima normal
      max: 100                   # FC máxima normal
      baseline: 75               # FC baseline
    blood-pressure:
      systolic-min: 90           # Sistólica mínima
      systolic-max: 140          # Sistólica máxima
      systolic-baseline: 120     # Sistólica baseline
      diastolic-min: 60          # Diastólica mínima
      diastolic-max: 90          # Diastólica máxima
      diastolic-baseline: 80     # Diastólica baseline
    temperature:
      min: 36.0                  # Temperatura mínima normal
      max: 37.5                  # Temperatura máxima normal
      baseline: 36.8             # Temperatura baseline

# ==========================================
# CONFIGURACIÓN DE LOGS
# ==========================================
logging:
  level:
    com.formacionbdi.microservicios.app.simulator: DEBUG
    org.springframework: INFO
    root: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# ==========================================
# PUERTO DE LA INTERFAZ WEB (OPCIONAL)
# ==========================================
server:
  port: 8011                     # Puerto para interfaz web opcional

# ==========================================
# CONFIGURACIÓN DE MONITOREO
# ==========================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always